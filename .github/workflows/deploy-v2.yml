name: 🚀 CloudForum 部署（优化版）

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudforum-deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 部署 Worker + Pages

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 缓存 node_modules ───
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            worker/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('worker/package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ─── 安装依赖 ───
      - name: Install dependencies
        run: |
          npm --prefix worker ci
          npm --prefix frontend ci

      # ─── TypeScript 类型检查 ───
      - name: TypeScript check (frontend)
        run: node frontend/node_modules/.bin/tsc -p frontend/tsconfig.json --noEmit

      # ─── 构建前端 ───
      - name: Build frontend
        run: |
          # VITE_API_BASE 优先用 secret，否则 fallback 到代码中的默认值
          if [ -n "$VITE_API_BASE" ]; then
            VITE_API_BASE="$VITE_API_BASE" npm --prefix frontend run build
          else
            npm --prefix frontend run build
          fi
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      # ─── 获取 D1 database_id ───
      - name: Resolve D1 database ID
        id: d1
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e '
            let input = "";
            process.stdin.on("data", c => input += c);
            process.stdin.on("end", () => {
              const list = JSON.parse(input);
              const db = Array.isArray(list) ? list.find(item => item.name === "forum-db") : null;
              process.stdout.write(db?.uuid ?? "");
            });
          ')

          if [ -z "$DB_ID" ]; then
            echo "🆕 创建 D1 database forum-db..."
            npx wrangler d1 create forum-db 2>&1
            DB_ID=$(npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", c => input += c);
              process.stdin.on("end", () => {
                const list = JSON.parse(input);
                const db = Array.isArray(list) ? list.find(item => item.name === "forum-db") : null;
                process.stdout.write(db?.uuid ?? "");
              });
            ')
          fi

          if [ -z "$DB_ID" ]; then
            echo "❌ 无法获取 D1 database ID"
            exit 1
          fi

          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "✅ D1 database id: $DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── 写入 database_id 到 wrangler.jsonc ───
      - name: Write database_id to wrangler.jsonc
        run: |
          DB_ID="${{ steps.d1.outputs.database_id }}"
          sed -i -E "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$DB_ID\"/" wrangler.jsonc
          echo "✅ wrangler.jsonc 已更新"

      # ─── 执行数据库迁移 ───
      - name: Apply D1 migrations
        run: |
          echo "📦 执行数据库迁移..."
          npx wrangler d1 migrations apply forum-db --remote
          echo "✅ 迁移完成"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── 部署 Worker ───
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── 确保 Pages 项目存在 ───
      - name: Ensure Cloudflare Pages project exists
        run: |
          if npx wrangler pages project list | grep -q "forum-frontend"; then
            echo "✅ Pages project 'forum-frontend' already exists"
          else
            echo "🆕 Creating Pages project 'forum-frontend'"
            npx wrangler pages project create forum-frontend --production-branch main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── 部署前端到 Pages ───
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=forum-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── 完成 ───
      - name: Success
        run: |
          echo "## ✅ CloudForum 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 组件 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| D1 数据库 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 类型检查 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages | ✅ |" >> $GITHUB_STEP_SUMMARY
